name: Short DTE foundation

on:
  push:
    branches: ['feature/short-dte-options-m0*']
  pull_request:
    paths:
      - 'agent/src/short_dte/**'
      - 'agent/tests/short_dte/**'
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - '.github/workflows/short-dte.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install offline-test dependencies
        run: python -m pip install 'pydantic>=2,<3' 'PyYAML>=6' tzdata pytest pytest-socket python-dotenv build setuptools wheel
      - name: Test foundation without network access
        run: python -m pytest agent/tests/short_dte --disable-socket -q
      - name: Build distribution
        run: python -m build --wheel --no-isolation --outdir dist-short-dte
      - name: Verify packaged defaults
        run: python -c "import glob,zipfile; z=zipfile.ZipFile(glob.glob('dist-short-dte/*.whl')[0]); assert 'src/short_dte/config/defaults.yaml' in z.namelist()"
